swagger: '2.0'
info:
  title: gen-examples
  version: 1.0.0
paths:
  /pets:
    get:
      produces:
        - application/json
      responses:
        '200':
          description: a pet
          schema:
            $ref: '#/definitions/Pet'
        '404':
          description: not found
          schema:
            type: string
          examples:
            application/json: nope
definitions:
  Pet:
    type: object
    required:
      - id
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
        example: Fido
      tags:
        type: array
        items:
          type: string
