openapi: 3.0.0
info:
  title: gen-examples
  version: 1.0.0
paths:
  /pets:
    get:
      responses:
        "200":
          description: a pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
              example:
                id: 0
                name: Fido
                tags:
                  - string
        "404":
          description: not found
          content:
            application/json:
              schema:
                type: string
              examples:
                response:
                  value: nope
components:
  schemas:
    Pet:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Fido
        tags:
          type: array
          items:
            type: string

